name: Release

# Tag-driven releases: `git tag v1.09 && git push origin v1.09` builds the
# flashable module zip and publishes it as a GitHub Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # Required: build.gradle.kts computes verCode and commitHash with
          # `git rev-list HEAD --count` / `git rev-parse --short HEAD`, which
          # are wrong on the default shallow clone.
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # Pinned to v5 on purpose: v6 extracted the caching code into
      # `gradle-actions-caching`, a proprietary component under the Gradle
      # Terms of Use rather than MIT. v5 still ships the MIT cache and already
      # runs on node24, so it clears the node20 deprecation warning too.
      - uses: gradle/actions/setup-gradle@v5
      - uses: android-actions/setup-android@v4
      - name: Install Android toolchain
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.85.0
          target: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          # v2 no longer defaults RUSTFLAGS to -D warnings; it uses the
          # `build.warnings` config (cargo >= 1.97) instead. This project pins
          # Rust 1.85, so pin the policy back to the v1 behaviour.
          rustflags: -D warnings
          build-warnings: ""
      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zygiskd/build/rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('zygiskd/Cargo.lock', 'build.gradle.kts') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: Install cargo-ndk (prebuilt)
        run: |
          set -euo pipefail
          VERSION=4.1.2
          TRIPLE=x86_64-unknown-linux-gnu
          ARCHIVE="cargo-ndk-${TRIPLE}-v${VERSION}.tgz"
          SHA256=9451622c4567e8abb2c8005001855e32901c0b716ccdd3a173a4375fd03426e1
          curl -fsSL -o "/tmp/${ARCHIVE}" \
            "https://github.com/bbqsrc/cargo-ndk/releases/download/v${VERSION}/${ARCHIVE}"
          echo "${SHA256}  /tmp/${ARCHIVE}" | sha256sum -c -
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp
          install -m 0755 "/tmp/cargo-ndk-${TRIPLE}-v${VERSION}/cargo-ndk" "${CARGO_HOME:-$HOME/.cargo}/bin/cargo-ndk"
          # cargo-ndk is a cargo subcommand: invoked directly it refuses to run
          # ("This binary may only be called via `cargo ndk`"), so ask cargo.
          cargo ndk --version
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: zygiskd/webui/pnpm-lock.yaml
      - name: Build release module
        env:
          # setup-rust-toolchain enables -D warnings globally. The existing
          # Android build is warning-clean only for its own crate flags, while
          # dependency diagnostics are not part of this release gate.
          RUSTFLAGS: ""
        run: bash ./gradlew :module:zipRelease --no-daemon --console=plain
      - name: Verify release artifact exists
        run: |
          set -euo pipefail
          ls -l module/build/outputs/release/
          test -n "$(ls -A module/build/outputs/release/*.zip 2>/dev/null)" \
            || { echo "::error::no module zip produced"; exit 1; }
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: module/build/outputs/release/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
