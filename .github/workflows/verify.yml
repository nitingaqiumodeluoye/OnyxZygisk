name: Verify

on:
  # Branch filter matters: without it every push to every topic branch runs the
  # full Android job (SDK + NDK + Rust + Gradle), which is by far the most
  # expensive job in this workflow.
  push:
    branches:
      - master
      - main
  pull_request:

# A new push to the same branch supersedes the previous run; cancel it instead
# of letting two Android builds compete for the same cache keys.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Stage 1: decide which parts of the tree changed. Its only job is to run
  # before everything else and produce booleans the other jobs can gate on.
  # `dorny/paths-filter` calls the GitHub REST "list files" API, which reports
  # up to 3000 changed files and therefore does not depend on the shallow
  # clone checkout performs here.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.filter.outputs.android }}
      webui: ${{ steps.filter.outputs.webui }}
      zigcore: ${{ steps.filter.outputs.zigcore }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            android:
              - 'module/**'
              - 'loader/**'
              - 'zygiskd/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - '.github/workflows/verify.yml'
            webui:
              - 'zygiskd/webui/**'
              - '.github/workflows/verify.yml'
            zigcore:
              - 'loader/zigcore/**'
              - '.github/workflows/verify.yml'
      # Print the decision so a skipped job is easy to explain from the log.
      - name: Summary
        run: |
          {
            echo "### Changed areas"
            echo ""
            echo "| Area | Run? |"
            echo "| --- | --- |"
            echo "| android | ${{ steps.filter.outputs.android }} |"
            echo "| webui | ${{ steps.filter.outputs.webui }} |"
            echo "| zigcore | ${{ steps.filter.outputs.zigcore }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  zigcore:
    name: Zig core tests
    needs: changes
    if: needs.changes.outputs.zigcore == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # mlugg/setup-zig already caches the Zig install and both the global and
      # local Zig cache directories (use-cache defaults to true), so no extra
      # actions/cache step is needed here.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Run Zig tests
        working-directory: loader/zigcore
        run: zig build test --summary all

  webui:
    name: WebUI checks
    needs: changes
    if: needs.changes.outputs.webui == 'true'
    runs-on: ubuntu-latest
    # The React stack adds a Playwright end-to-end suite, which downloads a
    # browser and boots a server before any spec runs.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
        with:
          # Pinned by package.json's packageManager field; a mismatch makes
          # `pnpm install --frozen-lockfile` fail rather than drift.
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: zygiskd/webui/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: zygiskd/webui
        run: pnpm install --frozen-lockfile
      # `biome ci`, not `pnpm lint`: the lint script is `biome check --write`,
      # which rewrites files. A check job must never mutate the tree it is
      # gating, so the read-only form is what belongs here.
      - name: Format and lint
        working-directory: zygiskd/webui
        run: pnpm check:biome
      - name: Type-check
        working-directory: zygiskd/webui
        run: pnpm type-check
      # The unit guards scan the real build output (the emitted stylesheet and
      # scripts), so they need a build first.
      - name: Build
        working-directory: zygiskd/webui
        run: pnpm build
      - name: Unit guards
        working-directory: zygiskd/webui
        run: pnpm test
      - name: Install Playwright browsers
        working-directory: zygiskd/webui
        run: pnpm exec playwright install --with-deps chromium
      - name: Behaviour and accessibility
        working-directory: zygiskd/webui
        run: pnpm test:e2e

  android:
    name: Android release package
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # build.gradle.kts derives verCode from `git rev-list HEAD --count`,
          # which returns 1 on the default shallow (fetch-depth: 1) clone.
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # Pinned to v5 on purpose: v6 extracted the caching code into
      # `gradle-actions-caching`, a proprietary component under the Gradle
      # Terms of Use rather than MIT. v5 still ships the MIT cache and already
      # runs on node24, so it clears the node20 deprecation warning too.
      - uses: gradle/actions/setup-gradle@v5
      - uses: android-actions/setup-android@v4
      - name: Install Android toolchain
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.85.0
          target: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          # v2 flipped the default: it no longer sets RUSTFLAGS=-D warnings and
          # instead relies on the `build.warnings` config via
          # CARGO_BUILD_WARNINGS. That config needs cargo >= 1.97 while this
          # project pins Rust 1.85, so the deny-warnings policy has to be
          # expressed through RUSTFLAGS, exactly as it was with v1. Without
          # this the warning gate would silently disappear.
          rustflags: -D warnings
          # Turn the cargo-1.97-only mechanism off explicitly so that a future
          # Rust upgrade cannot silently re-enable it behind our back.
          build-warnings: ""
      # Dependency sources plus the cargo-ndk target dir used by :zygiskd.
      # The key folds in build.gradle.kts because the pinned NDK version lives
      # there, and NDK changes must not reuse artifacts built by the old one.
      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zygiskd/build/rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('zygiskd/Cargo.lock', 'build.gradle.kts') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      # Prebuilt binary instead of `cargo install`, which would compile
      # cargo-ndk from source (~1.5-3 min) on every single run.
      #
      # The download is retried: the release CDN intermittently answers 504,
      # and without a retry that single hiccup fails the android job, which is
      # the most expensive job to re-run.
      - name: Install cargo-ndk (prebuilt)
        run: |
          set -euo pipefail
          VERSION=4.1.2
          TRIPLE=x86_64-unknown-linux-gnu
          ARCHIVE="cargo-ndk-${TRIPLE}-v${VERSION}.tgz"
          SHA256=9451622c4567e8abb2c8005001855e32901c0b716ccdd3a173a4375fd03426e1
          URL="https://github.com/bbqsrc/cargo-ndk/releases/download/v${VERSION}/${ARCHIVE}"
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "/tmp/${ARCHIVE}" "$URL"; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::Failed to download cargo-ndk after $attempt attempts"
              exit 1
            fi
            echo "cargo-ndk download attempt $attempt failed, retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          echo "${SHA256}  /tmp/${ARCHIVE}" | sha256sum -c -
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp
          install -m 0755 "/tmp/cargo-ndk-${TRIPLE}-v${VERSION}/cargo-ndk" "${CARGO_HOME:-$HOME/.cargo}/bin/cargo-ndk"
          # cargo-ndk is a cargo subcommand: invoked directly it refuses to run
          # ("This binary may only be called via `cargo ndk`"), so ask cargo.
          cargo ndk --version
      - uses: pnpm/action-setup@v6
        with:
          # Same pin as the webui job: package.json's packageManager field
          # is what pnpm actually enforces during the Gradle-driven build.
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: zygiskd/webui/pnpm-lock.yaml
      - name: Build release module
        env:
          # setup-rust-toolchain enables -D warnings globally. The existing
          # Android build is warning-clean only for its own crate flags, while
          # dependency diagnostics are not part of this release gate.
          RUSTFLAGS: ""
        run: bash ./gradlew :module:zipRelease --no-daemon --console=plain
      - name: Upload module ZIP
        uses: actions/upload-artifact@v7
        with:
          name: onyxzygisk-release
          path: module/build/outputs/release/*.zip
          if-no-files-found: error
          retention-days: 14
